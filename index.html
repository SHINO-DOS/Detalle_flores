<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- DEDICA:META -->
<title>Galaxia Simple  Flores de colores</title>
<meta name="description" content="Una galaxia sencilla con agujero negro, anillo dorado y fotos flotando entre frases del Día de las Flores Amarillas.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌻</text></svg>">
<!-- DEDICA:PRELOAD -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
<style>
  /* Sin esto, cualquier elemento con width/height:100% Y padding a la vez
     queda mas ancho/alto que el propio 100% (el padding se suma aparte con
     el box-sizing por defecto) - eso es lo que corria #start-screen 20px
     hacia la derecha (100% + 20px de padding a cada lado = 40px de sobra),
     desalineando el emoji y el texto de "Toca para iniciar" del centro real
     de la pantalla. */
  *{box-sizing:border-box;}
  html, body { margin:0; height:100%; background:#000; overflow:hidden; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  canvas { display:block; }

  #main-title{
    position:fixed;top:40px;left:0;right:0;width:100%;
    font-size:2.6em;color:#FFFACD;white-space:nowrap;
    text-shadow:0 0 10px #FFD700,0 0 18px #FFA500;
    z-index:10;pointer-events:none;text-align:center;
    font-family:'Indie Flower','Bradley Hand','Segoe Script',cursive;
  }
  @media (max-width:768px){
    #main-title{font-size:1.55em;top:22px;white-space:normal;padding:0 10px;line-height:1.15;}
  }

  #start-screen{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:#000;display:flex;justify-content:center;align-items:center;
    flex-direction:column;color:#fff;z-index:9999;padding:20px;cursor:pointer;
    transition:opacity .7s ease,visibility .7s ease;
  }
  #start-screen.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  /* #start-heart{
    font-size:clamp(74px,23vmin,148px);line-height:1;display:block;
    filter:drop-shadow(0 0 14px rgba(255,215,0,.75)) drop-shadow(0 0 36px rgba(255,165,0,.38)) drop-shadow(0 0 66px rgba(218,165,32,.22));
    animation:latido 1.35s ease-in-out infinite;transform-origin:50% 55%;
  } */
  #start-heart {
  width: clamp(130px, 25vmin, 230px);
  height: clamp(130px, 25vmin, 230px);
  object-fit: contain;
  display: block;

  filter:
    drop-shadow(0 0 14px rgba(255, 215, 0, 0.75))
    drop-shadow(0 0 36px rgba(255, 165, 0, 0.38))
    drop-shadow(0 0 66px rgba(218, 165, 32, 0.22));

  animation: latido 1.35s ease-in-out infinite;
  transform-origin: 50% 55%;
  }
  @keyframes latido{
    0%,100%{transform:scale(1);}
    12%{transform:scale(1.15);}
    24%{transform:scale(1);}
    36%{transform:scale(1.07);}
    50%{transform:scale(1);}
  }
  #start-text{
    font-size:1.8em;color:#FFFACD;font-family:'Indie Flower','Bradley Hand','Segoe Script',cursive;
    text-shadow:0 0 7px #FFD700;text-align:center;
    margin-top:clamp(16px,3.5vh,28px);
    animation:parpadeo 2.2s ease-in-out infinite;
  }
  @keyframes parpadeo{0%,100%{opacity:.55;}50%{opacity:1;}}
  @media (prefers-reduced-motion:reduce){
    #start-heart,#start-text{animation:none;}
  }
.controls{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:20;padding:8px;border:1px solid #ffd66b44;border-radius:32px;background:#090704bb;backdrop-filter:blur(12px)}
.controls button{border:1px solid #ffd66b33;background:#ffca4010;border-radius:50%;width:40px;height:40px;color:#ffe5a0;font-size:22px;cursor:pointer}.controls button:hover,.controls button:focus-visible{background:#ffd66b40;outline:2px solid #ffdb86}.hint{position:fixed;bottom:88px;width:100%;text-align:center;color:#eedcb399;font:12px system-ui;pointer-events:none}canvas{touch-action:none}#main-title{margin-top:0} @media(max-width:400px){.controls{gap:5px}.controls button{width:36px;height:36px}}
</style>
</head>
<body>
<canvas id="c" aria-label="Galaxia de flores amarillas interactiva"></canvas>
<nav class="controls" aria-label="Controles de la galaxia">
<button id="music" aria-label="Activar música">♫</button><button id="pause" aria-label="Pausar animación">Ⅱ</button><button id="zoom-in" aria-label="Acercar">+</button><button id="zoom-out" aria-label="Alejar">−</button><button id="reset" aria-label="Restablecer vista">↺</button><button id="full" aria-label="Pantalla completa">⛶</button>
</nav><p class="hint">Arrastra para explorar · Pellizca para acercarte</p>

<h1 id="main-title"></h1>

<div id="start-screen" role="button" tabindex="0" aria-label="Iniciar galaxia">
  <!-- <div id="start-heart" aria-hidden="true">🌻</div> -->
  <img id="start-heart" src="assets/imginicio.png" alt="Imagen de inicio"/>
  <div id="start-text">Toca para iniciar</div>
  <div id="start-text">Mujer virtuosa, ¿quién la hallará? Porque su estima sobrepasa largamente á la de piedras preciosas.</div>
</div>

<audio id="audio" loop>
  <source src="assets/musica.mp3" type="audio/mpeg">
</audio>

<script src="vendor/three.min.js"></script>

<script src="config.js"></script>
<script>
const CONFIG=(window.DEDICA&&window.DEDICA.merge)?window.DEDICA.merge(DEFAULTS,window.DEDICA.config):DEFAULTS;
</script>

<script>
// ================= Título fijo + música (arranca recién al tocar) =================
document.getElementById('main-title').textContent=CONFIG.titulo;
const audio=document.getElementById('audio');
audio.querySelector('source').src=CONFIG.musica;
audio.load();

// ================= Escena =================
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,5000);
let targetDist=300,currentDist=300,rotX=0.2,rotY=0;

// Fondo: negro solido + el campo de estrellas generado abajo. La textura
// de nebulosa externa que traia el archivo original apuntaba a una URL de
// GitHub que ya no existe (404 - nunca se veia, ni siquiera antes de este
// cambio) - se quita en vez de dejar una dependencia externa rota.

// Estrellas
(function makeStars(count=2000,spread=3000){
  const g=new THREE.BufferGeometry();
  const pos=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const r=spread*(0.3+Math.random()*0.7);
    const th=Math.random()*Math.PI*2;
    const ph=Math.acos(2*Math.random()-1);
    pos[i*3+0]=r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1]=r*Math.cos(ph);
    pos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
  }
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:1.5,color:0xffffff,depthWrite:false})));
})();

// Tierra creada dentro del proyecto: funciona incluso sin descargar imágenes externas.
// El lienzo es un mapa equirectangular (longitud -180..180, latitud 90..-90).
function earthTexture(){
  const c=document.createElement('canvas');c.width=2048;c.height=1024;
  const g=c.getContext('2d'),w=c.width,h=c.height;
  const sea=g.createLinearGradient(0,0,0,h);
  sea.addColorStop(0,'#123c6b');sea.addColorStop(.42,'#086aa0');sea.addColorStop(.75,'#075487');sea.addColorStop(1,'#123b69');
  g.fillStyle=sea;g.fillRect(0,0,w,h);
  // Costas dibujadas en coordenadas geográficas; permiten reconocer América,
  // África, Europa, Asia, Australia y la Antártida al girar el planeta.
  const lands=[
    [[-168,71],[-148,70],[-135,60],[-125,49],[-124,41],[-117,32],[-111,31],[-106,23],[-97,16],[-88,16],[-83,9],[-78,9],[-82,18],[-92,22],[-97,29],[-91,30],[-82,25],[-80,32],[-70,44],[-58,48],[-53,53],[-58,60],[-78,62],[-82,68],[-96,72],[-112,69],[-129,72],[-143,69],[-156,72]],
    [[-81,12],[-74,10],[-70,12],[-62,10],[-51,3],[-45,-1],[-35,-6],[-37,-14],[-42,-22],[-48,-27],[-52,-33],[-59,-38],[-65,-55],[-71,-50],[-73,-37],[-77,-25],[-80,-12],[-76,-2]],
    [[-52,60],[-43,59],[-40,66],[-45,73],[-42,81],[-51,83],[-60,79],[-55,72]],
    [[-17,36],[-6,36],[10,37],[21,32],[34,30],[40,12],[51,11],[50,2],[43,-12],[35,-19],[33,-28],[24,-35],[18,-34],[13,-23],[9,-4],[2,5],[-10,5],[-17,15]],
    [[-11,36],[-10,44],[-5,43],[2,50],[9,54],[18,55],[25,60],[32,62],[29,69],[42,70],[52,59],[65,56],[74,62],[89,60],[101,55],[114,54],[125,51],[138,48],[143,43],[135,37],[128,35],[121,22],[114,18],[110,10],[104,2],[98,5],[101,15],[95,22],[88,22],[81,9],[74,8],[68,24],[60,25],[55,16],[46,13],[43,22],[37,31],[34,35],[27,40],[20,38],[15,45],[10,44],[4,43],[-2,37]],
    [[112,-11],[122,-15],[131,-12],[138,-16],[145,-15],[153,-24],[151,-33],[145,-39],[133,-37],[125,-34],[115,-27]],
    [[47,-13],[50,-17],[49,-25],[45,-26],[43,-18]],
    [[-180,-76],[-150,-72],[-105,-76],[-65,-72],[-25,-77],[15,-72],[60,-76],[110,-72],[150,-75],[180,-73],[180,-90],[-180,-90]]
  ];
  const xy=([lon,lat])=>[(lon+180)/360*w,(90-lat)/180*h];
  g.shadowColor='#62c3bd';g.shadowBlur=12;
  lands.forEach((shape,i)=>{g.beginPath();shape.forEach((p,j)=>{const [x,y]=xy(p);j?g.lineTo(x,y):g.moveTo(x,y);});g.closePath();g.fillStyle=i===7?'#e3eff2':'#347b56';g.fill();});
  g.shadowBlur=0;
  // Textura orgánica reproducible: pequeñas zonas vegetales y desiertos.
  let seed=71483;const random=()=>((seed=(Math.imul(seed,1664525)+1013904223)|0)>>>0)/4294967296;
  for(let i=0;i<36000;i++){
    const x=random()*w,y=random()*h;
    const pixel=g.getImageData(x|0,y|0,1,1).data;
    if(pixel[1]>pixel[2]*.93 && pixel[0]>25){
      g.fillStyle=random()>.65?'rgba(207,184,119,.34)':'rgba(13,72,52,.28)';
      g.fillRect(x,y,2+random()*9,1+random()*4);
    }else if(random()>.87){g.fillStyle='rgba(105,202,227,.13)';g.fillRect(x,y,2+random()*10,1);}
  }
  const tex=new THREE.CanvasTexture(c);tex.anisotropy=renderer.capabilities.getMaxAnisotropy();return tex;
}
function cloudTexture(){
  const c=document.createElement('canvas');c.width=1024;c.height=512;const g=c.getContext('2d');
  let seed=12147;const random=()=>((seed=(Math.imul(seed,1664525)+1013904223)|0)>>>0)/4294967296;
  for(let i=0;i<460;i++){
    const x=random()*c.width,y=65+random()*380,r=5+random()*34;
    const cloud=g.createRadialGradient(x,y,0,x,y,r);
    cloud.addColorStop(0,'rgba(255,255,255,.26)');cloud.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=cloud;g.fillRect(x-r,y-r,2*r,2*r);
  }
  return new THREE.CanvasTexture(c);
}
const earth=new THREE.Group();scene.add(earth);
const core=new THREE.Mesh(new THREE.SphereGeometry(40,96,64),new THREE.MeshPhongMaterial({map:earthTexture(),shininess:24,specular:0x37789a}));
earth.add(core);
const clouds=new THREE.Mesh(new THREE.SphereGeometry(40.5,96,64),new THREE.MeshPhongMaterial({map:cloudTexture(),transparent:true,depthWrite:false,opacity:.8}));
earth.add(clouds);
const atmosphere=new THREE.Mesh(new THREE.SphereGeometry(42.2,96,64),new THREE.ShaderMaterial({
  uniforms:{},vertexShader:'varying vec3 vNormal;varying vec3 vEye;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);vNormal=normalize(normalMatrix*normal);vEye=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}',
  fragmentShader:'varying vec3 vNormal;varying vec3 vEye;void main(){float rim=pow(1.-max(dot(normalize(vNormal),normalize(vEye)),0.),3.);gl_FragColor=vec4(.25,.68,1.,rim*.52);}',
  transparent:true,depthWrite:false,side:THREE.FrontSide,blending:THREE.AdditiveBlending
}));earth.add(atmosphere);
scene.add(new THREE.AmbientLight(0xc0d8fa,.65));
const sunlight=new THREE.DirectionalLight(0xffedcf,1.4);sunlight.position.set(100,80,180);scene.add(sunlight);
earth.rotation.y=-.4;

// El título ahora vive en la cabecera fija (#main-title, ver DEDICA:CONFIG
// mas arriba) en vez de un sprite 3D en el centro - mas legible y
// consistente con el resto del catalogo.

// Glow exterior (reducido, para que el anillo se note más)
const GLOW_BASE=360;
function makeGlow(size=768,c1='255,235,130',c2='255,180,0'){
  const c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d');
  const grad=g.createRadialGradient(size/2,size/2,size*0.05,size/2,size/2,size*0.5);
  grad.addColorStop(0,'rgba('+c1+',0.55)');
  grad.addColorStop(0.5,'rgba('+c2+',0.25)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grad;g.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:makeGlow(),transparent:true,depthWrite:false}));
glow.scale.set(GLOW_BASE,GLOW_BASE,1);
scene.add(glow);

// Anillo único (antes eran 3 anillos separados con huecos reales entre
// ellos). Sigue siendo un solo disco continuo (42-116, sin huecos), pero
// ahora con textura de franjas finas superpuestas al degradado de base -
// como los anillos de Saturno, que se ven "en capas" por dentro sin
// separarse en piezas distintas.
function ringTexture(size=1024){
  const c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d');g.translate(size/2,size/2);
  const rInner=size*0.205,rOuter=size*0.49;
  // Base: un solo degradado continuo de borde a borde, sin apagarse hacia
  // el borde exterior, para que el anillo se vea denso y solido.
  const grd=g.createRadialGradient(0,0,rInner,0,0,rOuter);
  grd.addColorStop(0.00,'rgba(255,255,245,1)');
  grd.addColorStop(0.30,'rgba(255,235,120,1)');
  grd.addColorStop(0.65,'rgba(255,200,40,0.95)');
  grd.addColorStop(1.00,'rgba(255,160,0,0.85)');
  g.fillStyle=grd;
  g.beginPath();g.arc(0,0,rOuter,0,Math.PI*2);g.arc(0,0,rInner,0,Math.PI*2,true);g.closePath();g.fill();

  // Franjas concentricas finas por encima del degradado base - varian el
  // brillo (mas claras u oscuras), nunca la opacidad hasta 0, asi que no
  // dejan huecos ni se leen como anillos separados, solo como textura.
  const bandCount=26;
  for(let i=0;i<bandCount;i++){
    const r=rInner+(rOuter-rInner)*(i/(bandCount-1));
    const dark=i%3===0;
    g.beginPath();
    g.arc(0,0,r,0,Math.PI*2);
    g.lineWidth=(rOuter-rInner)/bandCount*(0.55+Math.random()*0.35);
    g.strokeStyle=dark?'rgba(110,60,0,0.20)':'rgba(255,255,225,0.16)';
    g.stroke();
  }
  return new THREE.CanvasTexture(c);
}
const ring=new THREE.Mesh(new THREE.RingGeometry(42,116,160),new THREE.MeshBasicMaterial({map:ringTexture(),transparent:true,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,opacity:1}));
ring.rotation.x=Math.PI/2;
scene.add(ring);

// Palabras alrededor: frases del Día de las Flores Amarillas (min 1, se repiten
// ciclicamente hasta llenar las 150 posiciones que la escena ya reserva,
// sin importar cuántas haya dejado el cliente - ver schema.json).
const frasesBase=(Array.isArray(CONFIG.frases)&&CONFIG.frases.length)?CONFIG.frases:DEFAULTS.frases;
const WORD_SLOTS=150;
const WORDS=Array.from({length:WORD_SLOTS},(_,i)=>frasesBase[i%frasesBase.length]);
const textTextureCache=new Map();
function makeTextTexture(text,color){
  const cacheKey=text+color;if(textTextureCache.has(cacheKey))return textTextureCache.get(cacheKey);
  const c=document.createElement('canvas');c.width=512;c.height=128;
  const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#fff';ctx.shadowColor=color;ctx.shadowBlur=30;
  // Antes el tamaño de fuente era fijo (60px) sin importar el largo de la
  // frase - una frase larga (con emoji, que ya de por si ocupa bastante
  // ancho) se salia del lienzo de 512px y quedaba cortada a la mitad. Ahora
  // el tamaño se reduce hasta que la frase completa entra, con un piso de
  // 24px para que no se vuelva ilegible.
  const maxWidth=c.width-48;
  let fontSize=60;
  ctx.font=fontSize+"px 'Indie Flower', cursive";
  while(ctx.measureText(text).width>maxWidth&&fontSize>24){
    fontSize-=2;
    ctx.font=fontSize+"px 'Indie Flower', cursive";
  }
  ctx.fillText(text,c.width/2,c.height/2);
  const texture=new THREE.CanvasTexture(c);textTextureCache.set(cacheKey,texture);return texture;
}
const COLORS=['#ffd700','#ffe066','#ffcc33','#ffb347','#fff2b0','#ffaa00','#f4c430','#e6b800','#ffdb58','#f0c419'];
const textGroup=new THREE.Group();scene.add(textGroup);
// Se espera a que 'Indie Flower' termine de cargar antes de dibujar las
// frases en canvas - a diferencia del texto normal del DOM (el navegador ya
// resuelve el "parpadeo" de fuente por su cuenta), un canvas dibuja con la
// fuente que este disponible EN ESE INSTANTE: sin esto, las 150 frases
// quedaban grabadas para siempre con la tipografia de respaldo (Arial) si
// la fuente todavia no habia terminado de bajar en el momento exacto en que
// corria este bucle.
document.fonts.load("40px 'Indie Flower'").catch(()=>{}).then(()=>{
  for(let i=0;i<WORDS.length;i++){
    const tex=makeTextTexture(WORDS[i],COLORS[i%COLORS.length]);
    const mat=new THREE.SpriteMaterial({map:tex,transparent:true});
    const sp=new THREE.Sprite(mat);
    sp.scale.set(68,21.8,1);
    const phi=Math.acos(2*Math.random()-1);const theta=Math.random()*Math.PI*2;
    const r=150+Math.random()*120;
    sp.position.set(r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta));
    sp.userData={phi:phi,theta:theta,radius:r,speed:0.001+Math.random()*0.001};
    textGroup.add(sp);
  }
});

// Fotos del cliente flotando de forma individual (reemplazan a los emojis de
// la version original). Minimo 1, maximo 3 (plantilla gratuita, ver
// schema.json) - se reparten ciclicamente (i % cantidad) entre las 26
// posiciones fijas que la escena ya reserva, igual que antes hacian los
// emojis, asi que menos fotos simplemente se repiten mas seguido sin que la
// escena se vea mas vacia.
const fotosBase=(Array.isArray(CONFIG.fotos)&&CONFIG.fotos.length)?CONFIG.fotos:DEFAULTS.fotos;
function makePhotoSprite(url,size){
  const c=document.createElement('canvas');c.width=c.height=256;
  const tex=new THREE.CanvasTexture(c);
  const mat=new THREE.SpriteMaterial({map:tex,transparent:true});
  const sp=new THREE.Sprite(mat);
  sp.scale.set(size,size,1);
  const img=new Image();
  // En archivos locales (file://), crossOrigin="anonymous" puede hacer que
  // Chrome bloquee las flores aunque estén dentro de assets/. Solo hace
  // falta para direcciones web externas.
  if(/^https?:\/\//i.test(url))img.crossOrigin='anonymous';
  img.onload=()=>{
    const ctx=c.getContext('2d');
    ctx.clearRect(0,0,c.width,c.height);
    // "contain": la foto entra completa sin recortar ningun borde (lo que
    // sobra en el lienzo cuadrado queda transparente); el sprite se encoge
    // en el eje sobrante para que no se note como un marco cuadrado vacio.
    const s=Math.min(c.width/img.width,c.height/img.height);
    ctx.drawImage(img,(c.width-img.width*s)/2,(c.height-img.height*s)/2,img.width*s,img.height*s);
    tex.needsUpdate=true;
    const aspect=img.naturalWidth/img.naturalHeight;
    const aX=Math.min(1,aspect),aY=Math.min(1,1/aspect);
    sp.scale.set(size*aX,size*aY,1);
  };
  img.onerror=()=>{
    // Respaldo visible: si falta una imagen o el navegador bloquea la ruta,
    // la escena no queda vacía y muestra una flor amarilla.
    const ctx=c.getContext('2d');
    ctx.clearRect(0,0,c.width,c.height);
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='190px sans-serif';
    ctx.fillText('🌻',c.width/2,c.height/2+8);
    tex.needsUpdate=true;
    console.warn('No se pudo cargar la flor:',url);
  };
  img.src=url;
  return sp;
}
const photoGroup=new THREE.Group();scene.add(photoGroup);
const PHOTO_COUNT=26;
for(let i=0;i<PHOTO_COUNT;i++){
  const url=fotosBase[i%fotosBase.length];
  const size=28+Math.random()*20;
  const sp=makePhotoSprite(url,size);
  const phi=Math.acos(2*Math.random()-1);const theta=Math.random()*Math.PI*2;
  const r=140+Math.random()*170;
  sp.position.set(r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta));
  sp.userData={phi:phi,theta:theta,radius:r,speed:0.0006+Math.random()*0.0012};
  photoGroup.add(sp);
}

// Controles independientes: ratón, pantalla táctil y pellizco.
let dragging=false,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
const pointers=new Map();let pinch=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});dragging=true;});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const [a,b]=[...pointers.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)targetDist=Math.max(160,Math.min(600,targetDist+(pinch-d)*.5));pinch=d;}else{rotY-=(e.clientX-old.x)/innerWidth*5;rotX=Math.max(-1.2,Math.min(1.2,rotX+(e.clientY-old.y)/innerHeight*3.5));}});
function release(e){pointers.delete(e.pointerId);pinch=0;dragging=pointers.size>0;}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
canvas.addEventListener('wheel',e=>{e.preventDefault();targetDist=Math.max(160,Math.min(600,targetDist+e.deltaY*.25));},{passive:false});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
document.getElementById('zoom-in').onclick=()=>targetDist=Math.max(160,targetDist-40);
document.getElementById('zoom-out').onclick=()=>targetDist=Math.min(600,targetDist+40);
document.getElementById('reset').onclick=()=>{targetDist=300;rotX=.2;rotY=0;};
const pauseButton=document.getElementById('pause');
function syncPause(){pauseButton.textContent=paused?'▶':'Ⅱ';pauseButton.setAttribute('aria-label',paused?'Reanudar animación':'Pausar animación');}syncPause();
pauseButton.onclick=()=>{paused=!paused;syncPause();};
const musicButton=document.getElementById('music');
function syncMusic(){musicButton.textContent=audio.paused?'♫':'♪';musicButton.setAttribute('aria-label',audio.paused?'Activar música':'Silenciar música');musicButton.setAttribute('aria-pressed',String(!audio.paused));}
musicButton.onclick=()=>{if(audio.paused)audio.play().catch(()=>{musicButton.title='No se pudo reproducir la música';});else audio.pause();};audio.addEventListener('play',syncMusic);audio.addEventListener('pause',syncMusic);
document.getElementById('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{});};
let lastFrame=0,step=1;
// Animación
let t=0;
function tick(now=0){requestAnimationFrame(tick);step=paused?0:Math.min((now-lastFrame)/16.667,2);lastFrame=now;t+=0.01*step;
  ring.rotation.z+=0.003*step;
  glow.scale.set(GLOW_BASE*(1+Math.sin(t*0.4)*0.03),GLOW_BASE*(1+Math.sin(t*0.4)*0.03),1);
  earth.rotation.y+=0.0025*step;
  clouds.rotation.y+=0.00045*step;
  textGroup.children.forEach(sp=>{
    sp.material.opacity=0.8+0.2*Math.sin(t*2);
    sp.userData.theta+=sp.userData.speed*step;
    sp.position.x=sp.userData.radius*Math.sin(sp.userData.phi)*Math.cos(sp.userData.theta);
    sp.position.z=sp.userData.radius*Math.sin(sp.userData.phi)*Math.sin(sp.userData.theta);
  });
  photoGroup.children.forEach(sp=>{
    sp.material.opacity=0.85+0.15*Math.sin(t*2+sp.userData.radius);
    // Sin rotacion propia: a diferencia de un emoji (simetrico, giraba bien
    // como si fuera un pinwheel), una foto real con forma reconocible se ve
    // rara/como "estirada" al girar sobre su propio eje en ciertos angulos -
    // se quita, la foto solo orbita y flota, se queda siempre derecha.
    sp.userData.theta+=sp.userData.speed*step;
    sp.position.x=sp.userData.radius*Math.sin(sp.userData.phi)*Math.cos(sp.userData.theta);
    sp.position.z=sp.userData.radius*Math.sin(sp.userData.phi)*Math.sin(sp.userData.theta);
  });
  currentDist+=(targetDist-currentDist)*0.06;
  const cx=Math.cos(rotX),sx=Math.sin(rotX);const cy=Math.cos(rotY),sy=Math.sin(rotY);
  camera.position.set(currentDist*sy*cx,currentDist*sx,currentDist*cy*cx);camera.lookAt(0,0,0);
  renderer.render(scene,camera);
}
tick();

// ── Arranque: la musica recien empieza cuando se toca la pantalla ──
const startScreen=document.getElementById('start-screen');
function startExperience(){
  startScreen.classList.add('hidden');
  setTimeout(()=>startScreen.style.display='none',800);
  audio.play().catch(()=>{});
}
startScreen.addEventListener('click',startExperience);
startScreen.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();startExperience();}});
</script>
